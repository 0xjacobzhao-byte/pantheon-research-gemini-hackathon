<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pantheon Research — Governed AI-Native Investment Research OS. Gemini, five-model research, governed data, human-in-the-loop. Build with Gemini XPRIZE 2026.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle layered grid, evoking the seven-layer stack without being architecture text -->
  <g opacity="0.10">
    <rect x="72"  y="150" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="196" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="242" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="288" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="334" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="380" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
    <rect x="72"  y="426" width="1136" height="34" rx="6" fill="none" stroke="#7aa5ff" stroke-width="1"/>
  </g>

  <!-- top accent rule -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>

  <!-- wordmark -->
  <text x="640" y="196" text-anchor="middle" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Pantheon Research</text>

  <!-- positioning line -->
  <text x="640" y="252" text-anchor="middle" font-size="27" font-weight="600" fill="#8fb4ff">Governed AI-Native Investment Research OS</text>

  <!-- divider -->
  <rect x="500" y="284" width="280" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>

  <!-- principle -->
  <text x="640" y="336" text-anchor="middle" font-size="21" fill="#c7d5ee">AI should not replace the investor.</text>
  <text x="640" y="368" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">AI should compound the investor&#8217;s discipline.</text>

  <!-- pillars -->
  <g>
    <rect x="196" y="418" width="196" height="46" rx="23" fill="#16233d" stroke="#4285f4" stroke-width="2"/>
    <text x="294" y="447" text-anchor="middle" font-size="17" font-weight="700" fill="#8ab4f8">Gemini</text>

    <rect x="406" y="418" width="252" height="46" rx="23" fill="#16233d" stroke="#33415c" stroke-width="1.5"/>
    <text x="532" y="447" text-anchor="middle" font-size="17" fill="#c7d5ee">Five-Model Research</text>

    <rect x="672" y="418" width="216" height="46" rx="23" fill="#16233d" stroke="#33415c" stroke-width="1.5"/>
    <text x="780" y="447" text-anchor="middle" font-size="17" fill="#c7d5ee">Governed Data</text>

    <rect x="902" y="418" width="252" height="46" rx="23" fill="#16233d" stroke="#34a853" stroke-width="2"/>
    <text x="1028" y="447" text-anchor="middle" font-size="17" font-weight="600" fill="#7ee2a8">Human-in-the-Loop</text>
  </g>

  <!-- event line -->
  <text x="640" y="536" text-anchor="middle" font-size="19" font-weight="600" fill="#8fb4ff" letter-spacing="2.5">BUILD WITH GEMINI XPRIZE 2026</text>

  <!-- footer -->
  <text x="640" y="580" text-anchor="middle" font-size="15" fill="#7c8db0">pantheon-research.com</text>

  <!-- bottom accent rule -->
  <rect x="0" y="635" width="1280" height="5" fill="url(#accent)"/>
</svg>
